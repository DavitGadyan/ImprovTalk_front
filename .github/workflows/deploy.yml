name: Deploy site

# Builds the static export and publishes it to GitHub Pages at improvtalk.vip.
#
# Pages rather than a GCS bucket behind the load balancer: the LB path required
# minting a new multi-SAN certificate and swapping it onto the HTTPS proxy that
# also serves the live production API, which is a real outage risk for a
# marketing site. Pages provisions and renews TLS on its own and costs nothing.
#
# One-time setup is in docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes interleave. Not cancel-in-progress: a half-finished
# deploy that gets cancelled can leave the site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify tracking invariants
        # The money path breaks silently: a removed id or a renamed label still
        # builds and still looks right. Cheaper to fail here than in Ads.
        run: node scripts/verify-tracking.mjs

      - name: Verify the export
        # A silent partial export would otherwise replace a working site.
        # Cheaper to fail here than to find out from a visitor.
        run: |
          set -euo pipefail
          for f in index.html privacy/index.html terms/index.html support/index.html \
                   get/index.html billing/success/index.html billing/cancel/index.html \
                   sitemap.xml robots.txt qr-get.svg \
                   scenarios/coffee-shop.mp4 scenarios/bali-beach.mp4 \
                   scenarios/barcelona-beach.mp4 scenarios/gym.mp4; do
            [ -s "out/$f" ] || { echo "::error::missing or empty out/$f"; exit 1; }
          done

          # Jekyll strips underscore-prefixed paths, which is all of _next.
          # Without this the site renders with no CSS and no JS.
          [ -f out/.nojekyll ] || { echo "::error::out/.nojekyll missing"; exit 1; }

          # Without CNAME in the artifact, Pages drops the custom domain on
          # every deploy and reverts to github.io.
          grep -qx 'improvtalk.vip' out/CNAME || { echo "::error::out/CNAME wrong"; exit 1; }

          echo "export OK — $(find out -type f | wc -l | tr -d ' ') files, $(du -sh out | cut -f1)"

      - uses: actions/configure-pages@v5
        # Creates the Pages site on first run rather than failing until someone
        # toggles it in Settings. The custom domain still has to be set there.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Everything above can go green while the live site serves something else
  # entirely. That is not hypothetical: with the Pages source set to "Deploy from
  # a branch" instead of "GitHub Actions", GitHub's own Jekyll builder publishes
  # the repository root and silently discards this workflow's artifact — the
  # domain then serves a rendered README, every route 404s, and the deploy still
  # reports success. It went unnoticed until someone opened the site.
  #
  # So: verify what is actually being served, not what we uploaded.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live site is this app
        run: |
          set -uo pipefail
          SITE="https://improvtalk.vip"

          # Pages serves partial state for a minute or two after a deploy, so
          # poll rather than failing on the first miss.
          for i in $(seq 1 15); do
            body=$(curl -sL --max-time 20 "$SITE/?ci=$(date +%s)" || true)
            if printf '%s' "$body" | grep -q '_next/static'; then
              echo "live site is the Next export (attempt $i)"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "::error::$SITE is not serving this app after 15 attempts."
              echo "::error::Served title: $(printf '%s' "$body" | grep -o '<title>[^<]*</title>' | head -1)"
              echo "::error::If this is a rendered README, Settings > Pages > Source is on"
              echo "::error::'Deploy from a branch'. It must be 'GitHub Actions'."
              exit 1
            fi
            sleep 12
          done

          # A homepage alone is not a working site. The Jekyll failure mode
          # serves index and 404s everything else, so check real routes.
          fail=0
          for path in /sitemap.xml /robots.txt /llms.txt /about/ /blog/ /privacy/ /how-to-start-a-conversation/; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$path" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              fail=1
            else
              echo "  $path 200"
            fi
          done

          # The custom domain is dropped whenever CNAME is missing from the
          # artifact, which shows up as a redirect to github.io.
          final=$(curl -sL -o /dev/null -w '%{url_effective}' --max-time 20 "$SITE/" || true)
          case "$final" in
            https://improvtalk.vip/*) echo "  custom domain intact" ;;
            *) echo "::error::$SITE/ resolved to $final — CNAME lost"; fail=1 ;;
          esac

          [ "$fail" -eq 0 ] || exit 1
          echo "live site verified"
